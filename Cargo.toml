[package]
name = "strava-dl"
version = "0.2.0"
default-run = "strava-dl"
edition = "2021"
description = "Download accessible Strava athlete media"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"

[[bin]]
name = "strava-dl"
path = "src/main.rs"

[[bin]]
name = "sdl"
path = "src/main.rs"
