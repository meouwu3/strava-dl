[package]
name = "strava-dl"
version = "0.3.4"
default-run = "strava-dl"
edition = "2021"
rust-version = "1.74"
description = "Download accessible Strava athlete media"
license = "MIT"
repository = "https://github.com/meouwu3/strava-dl"
homepage = "https://github.com/meouwu3/strava-dl"
readme = "README.md"
keywords = ["strava", "cli", "download"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
zip = "2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "strava-dl"
path = "src/main.rs"

[[bin]]
name = "sdl"
path = "src/bin/sdl.rs"
